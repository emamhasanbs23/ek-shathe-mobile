name: ek_shathe_mobile
description: "Ek-Shathe Application. Clean Architecture, Riverpod, GoRouter, Dio."
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.12.0

dependencies:
  app_links: ^7.2.0
  connectivity_plus: ^7.2.0
  cupertino_icons: ^2.0.0
  cupertino_ui: ^1.1.7
  dart_mappable: ^4.8.0
  dio: ^5.5.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_screenutil: ^5.9.0
  flutter_secure_storage: ^11.2.0
  fpdart: ^1.1.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: any
  json_annotation: ^4.9.0
  logger: ^2.4.0
  material_ui: ^1.11.1
  package_info_plus: ^10.2.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.9.2
  riverpod_annotation: ^4.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.4.13
  dart_mappable_builder: ^4.8.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  retrofit_generator: ^10.2.7
  riverpod_generator: ^4.0.4
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

# Native launch splash (Android/iOS window before first Flutter frame).
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/ek_shathe_symbol_transparent_1024.png
  color_dark: "#FFFFFF"
  image_dark: assets/branding/ek_shathe_symbol_transparent_1024.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    image: assets/branding/ek_shathe_symbol_transparent_1024.png
    color_dark: "#FFFFFF"
    image_dark: assets/branding/ek_shathe_symbol_transparent_1024.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#FFFFFF"

# Home-screen / Android 12 splash icon (replaces default Flutter mark).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/ek_shathe_symbol_transparent_1024.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/ek_shathe_symbol_transparent_1024.png
